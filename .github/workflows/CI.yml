name: CI
on: 
  pull_request:
    branches: ["develop"]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [jhotdraw-core, jhotdraw-utils]
    defaults:
      run:
        working-directory: ${{ matrix.module }}

    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
    
      - name: Build project
        run: mvn clean install -DskipTests
        
      - name: Run tests
        run: mvn tests

